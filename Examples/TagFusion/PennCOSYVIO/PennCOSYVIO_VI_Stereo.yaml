%YAML:1.0

#--------------------------------------------------------------------------------------------
# PennCOSYVIO VI-Sensor stereo, e.g. visensor/af|as|bf|bs
# 官方说明：bag 中为 rectified 帧（尽管标定有瑕疵），故用 Rectified + Stereo.b，
# 避免 PinHole+Camera2 触发二次 stereoRectify。
# Intrinsics: https://daniilidis-group.github.io/penncosyvio/intrinsic_calib/
# Baseline ~0.1104 m from T_B_VL / T_B_VR
# Image: 752 x 480, ~20 FPS
# 若跟踪/消歧很差，可改用官方 Kalibr 左右目标定：
#   https://daniilidis-group.github.io/penncosyvio/extrinsic_calib/
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "Rectified"

# 左目内参；矫正后左右共用（右目仅作 Tag IPPE / 显示）
Camera1.fx: 445.80
Camera1.fy: 445.15
Camera1.cx: 371.50
Camera1.cy: 237.33

Camera2.fx: 445.80
Camera2.fy: 445.15
Camera2.cx: 371.50
Camera2.cy: 237.33

Camera.width: 752
Camera.height: 480

# Must be integer (Settings::readParameter<int>)
Camera.fps: 20

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0
# 基线（米）；bf = fx * b ≈ 49.21
Stereo.b: 0.110384686

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1200
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.enable: 1
Viewer.KeyFrameSize: 0.01
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.015
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 1.0
Viewer.showTagMap: 1
Viewer.showTagKFs: 0

System.saveOnlinePose: 1
System.saveOnlinePoseFile: "OnlineCameraTrajectory.txt"

#--------------------------------------------------------------------------------------------
# Tag Parameters  (backend: Thirdparty/apriltag ethz_apriltag2)
#--------------------------------------------------------------------------------------------
Tag.family: "tag36h11"
Tag.hamming: 2
Tag.black_border: 1
# PennCOSYVIO tags are printed on letter-size paper; adjust if measured black-square side differs
Tag.size: 0.16
Tag.clahe: 1
Tag.clahe_clip_limit: 2.0
Tag.clahe_tile_grid: 8
Tag.verbose: 1
Tag.export: 1
Tag.export_dir: "tag_export_penncosyvio_stereo"
Tag.viewer: 0
Tag.save_vis: 0
Tag.save_vis_dir: "tag_vis"
Tag.show_in_orb_viewer: 1

# ========================== local BA配置 ==========================
Tag.pose_optimization: 1   # 纯视觉 PoseOptimization 与惯性 PoseInertial* 共用（运行时只走当前传感器对应的一条分支）
Tag.corner_sigma: 2.0
Tag.min_inlier_corners: 3
Tag.fixed_only: 1
Tag.local_ba.enable: 1
Tag.local_ba.optimize_active: 1
Tag.local_ba.corner_sigma: 2.0
Tag.local_ba.min_inlier_corners: 3
Tag.local_ba.verbose: 1

# ========================== 角点因子自适应权重配置 ==========================
Tag.factor_weight.enable: 0
Tag.factor_weight.alpha: 3.0          # Tag / feature 基础权重比
Tag.factor_weight.s_sat: 400.0        # 基本满权面积 px^2
Tag.factor_weight.lambda_s: 3.0
Tag.factor_weight.theta0_deg: 60.0    # 视角特征尺度
Tag.factor_weight.lambda_theta: 1.0
Tag.factor_weight.phi0_deg: 15.0      # IPPE 双解显著旋转差
Tag.factor_weight.e0: 1.0             # 双解 residual 区分尺度 px
Tag.factor_weight.lambda_amb: 0.0         # 0=关闭双解项（w_amb≡1）
Tag.factor_weight.w_min: 0.001
Tag.factor_weight.verbose: 0          # 1=打印 S,θ,Δφ,Δe 与各分项权重

# ========================== 回环配置 ==========================
Tag.loop.enable: 1
Tag.loop.min_history_observations: 2
Tag.loop.min_keyframe_gap: 30 # 历史回环 KF 与当前 KF 的最小 ID 间隔
Tag.loop.min_reobservation_gap_kfs: 30 # 最近一次有效观测间隔；过小视为连续可见，不是重新观察
Tag.loop.min_historical_kf_map_points: 20 # 历史 KF 至少需有这么多跟踪地图点
Tag.loop.max_ippe_reprojection_error: 5.0 # IPPE解的重投影误差阈值
Tag.loop.max_stereo_translation_error: 0.20 # 左右目当前相机位姿的位移差阈值
Tag.loop.max_stereo_rotation_error: 0.20 # 左右目当前相机位姿旋转差阈值
Tag.loop.max_roll_pitch_correction: 0.15 # Sim3修正的roll和pitch差阈值
Tag.loop.max_yaw_correction: 1.57 # Sim3修正的yaw差阈值
Tag.loop.min_consistent_tags: 1 # 至少需要多少个一致的Tag才能认为存在回环
Tag.loop.reference_timeout_kfs: 4 # 连续若干 KF 未见该 Tag 则清除冻结回环参考
Tag.loop.verbose: 1
