%YAML:1.0

#--------------------------------------------------------------------------------------------
# XREAL Glass cam0+cam1 (room-patrol) — TagFusion stereo
# Dataset example:
#   /home/geneta/dataset/20260227-room-patrol-11-1/raw_data/glass/cam0/images
#   /home/geneta/dataset/20260227-room-patrol-11-1/raw_data/glass/cam1/images
#   images: m0000000.pgm ... + timestamps.txt（左右同名、同时间戳）
# Resolution (W x H): 480 x 640
#
# NOTE: glass_config 为 fisheye624（kc 12 维）。
#       ORB-SLAM3 使用 KannalaBrandt8（k1..k4）；Camera1 为既有等效拟合，
#       Camera2 暂用 glass_config device_2 的 kc[0:4] 近似。
# Stereo.T_c1_c2 由 glass_config 中 imu_T_cam（JPL qx,qy,qz,qw）推算：
#   T_c1_c2 = inv(T_i_c1) * T_i_c2，基线约 0.137 m
#--------------------------------------------------------------------------------------------

File.version: "1.0"

# 跟踪 OK 后每帧 append 一行 TUM: t tx ty tz qx qy qz qw（相机 Twc）
System.saveOnlinePose: 1
System.saveOnlinePoseFile: "OnlineCameraTrajectory.txt"

#--------------------------------------------------------------------------------------------
# Camera Parameters
#--------------------------------------------------------------------------------------------
Camera.type: "KannalaBrandt8"

# Left = cam0 / device_1
Camera1.fx: 240.7419863233
Camera1.fy: 240.7144386986
Camera1.cx: 242.1941637626
Camera1.cy: 319.6862062347

Camera1.k1: -0.00125597
Camera1.k2:  0.08114141
Camera1.k3: -0.08559616
Camera1.k4:  0.02660804

# Right = cam1 / device_2
Camera2.fx: 240.9836483777
Camera2.fy: 241.2057072203
Camera2.cx: 234.6025171495
Camera2.cy: 315.5065436685

# glass_config device_2 kc[0:4] 近似（非完整 fisheye624）
Camera2.k1: -0.0018835397644940066
Camera2.k2:  0.09290193304828773
Camera2.k3: -0.12533434828731227
Camera2.k4:  0.07503848461787668

Camera.width: 480
Camera.height: 640

# 约 30 Hz（timestamps.txt 相邻帧间隔 ~0.033s）；Settings 要求整数
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. Ignored if grayscale)
Camera.RGB: 1

# 鱼眼双目立体匹配重叠列范围（整幅）
Camera1.overlappingBegin: 0
Camera1.overlappingEnd: 479
Camera2.overlappingBegin: 0
Camera2.overlappingEnd: 479

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0

# T_c1_c2：左相机(cam0)系下右相机(cam1)位姿
Stereo.T_c1_c2: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.989881988738552, -0.009585580736115,  0.141568940848478,  0.137027285747399,
          0.009269173718980,  0.999952851658752,  0.002894283693308,  0.000227494681073,
         -0.141590009497760, -0.001552772192368,  0.989924167857792, -0.009280938608079,
          0.0, 0.0, 0.0, 1.0]

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1200
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters (ORB Pangolin)
#--------------------------------------------------------------------------------------------
# 是否开启 ORB 自带可视化（1=开，0=关；有此项时覆盖 System 构造参数 bUseViewer）
Viewer.enable: 1
# 尺寸单位与地图尺度一致。原先（归一化尺度 medianDepth≈1）默认：
#   KeyFrameSize=0.05, CameraSize=0.08
# Tag 米制 + 短基线(~1–2cm)时锥体若接近基线长度会“看起来”尺度不对，宜再缩小
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 2.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.5
Viewer.ViewpointZ: -1.2
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 1.0
# ORB 地图中叠加 TagMap（方框/轴）；Show Tag KFs 为 Tag 初始化关键帧相机锥
Viewer.showTagMap: 1
Viewer.showTagKFs: 1

#--------------------------------------------------------------------------------------------
# Tag Parameters  (backend: Thirdparty/apriltag ethz_apriltag2)
#--------------------------------------------------------------------------------------------
Tag.family: "tag36h11"          # tag36h11/tag36h9/tag25h9/tag25h7/tag16h5
Tag.hamming: 2                  # 接受的最大 hammingDistance（召回可试 2；正式可收紧到 1）
Tag.black_border: 2             # ethz TagDetector blackBorder；标准印刷 tag36h11 一般为 1
Tag.size: 0.06                  # Tag 边长（米），IPPE 用
Tag.gamma: 1.0                  # <1 提亮暗部；1=关闭
Tag.verbose: 1
Tag.export: 1                  # 1=导出；定标写初始地图，Shutdown 再写终局 Tag+ORB
Tag.export_dir: "tag_export"   # init CSV + orb_final_*.csv / *_final_keyframes_tum.txt / final_map.ply
Tag.viewer: 0
Tag.save_vis: 0                 # 1=每帧保存 Tag 检测图到 Tag.save_vis_dir
Tag.save_vis_dir: "tag_vis"
Tag.show_in_orb_viewer: 1       # 1=ORB Current Frame 叠加 Tag；双目并排左右

# ========================== local BA配置 ==========================
Tag.pose_optimization: 1   # 纯视觉 PoseOptimization 与惯性 PoseInertial* 共用（运行时只走当前传感器对应的一条分支）
Tag.corner_sigma: 2.0
Tag.min_inlier_corners: 3
Tag.fixed_only: 0
Tag.local_ba.enable: 1
Tag.local_ba.optimize_active: 1
Tag.local_ba.corner_sigma: 2.0
Tag.local_ba.min_inlier_corners: 3
Tag.local_ba.verbose: 1

# ========================== 角点因子自适应权重配置 ==========================
Tag.factor_weight.enable: 0
Tag.factor_weight.alpha: 3.0          # Tag / feature 基础权重比
Tag.factor_weight.s_sat: 400.0        # 基本满权面积 px^2
Tag.factor_weight.lambda_s: 3.0
Tag.factor_weight.theta0_deg: 60.0    # 视角特征尺度
Tag.factor_weight.lambda_theta: 1.0
Tag.factor_weight.phi0_deg: 15.0      # IPPE 双解显著旋转差
Tag.factor_weight.e0: 1.0             # 双解 residual 区分尺度 px
Tag.factor_weight.lambda_amb: 0.0         # 0=关闭双解项（w_amb≡1）
Tag.factor_weight.w_min: 0.001
Tag.factor_weight.verbose: 0          # 1=打印 S,θ,Δφ,Δe 与各分项权重

# ========================== 回环配置 ==========================
Tag.loop.enable: 1
Tag.loop.min_history_observations: 2
Tag.loop.min_keyframe_gap: 30 # 历史回环 KF 与当前 KF 的最小 ID 间隔
Tag.loop.min_reobservation_gap_kfs: 30 # 最近一次有效观测间隔；过小视为连续可见，不是重新观察
Tag.loop.min_historical_kf_map_points: 20 # 历史 KF 至少需有这么多跟踪地图点
Tag.loop.max_ippe_reprojection_error: 5.0 # IPPE解的重投影误差阈值
Tag.loop.max_stereo_translation_error: 0.20 # 左右目当前相机位姿的位移差阈值
Tag.loop.max_stereo_rotation_error: 0.20 # 左右目当前相机位姿旋转差阈值
Tag.loop.max_roll_pitch_correction: 0.15 # Sim3修正的roll和pitch差阈值
Tag.loop.max_yaw_correction: 1.57 # Sim3修正的yaw差阈值
Tag.loop.min_consistent_tags: 1 # 至少需要多少个一致的Tag才能认为存在回环
Tag.loop.reference_timeout_kfs: 4 # 连续若干 KF 未见该 Tag 则清除冻结回环参考
Tag.loop.verbose: 1
